<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合唱祭 練習音源</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: linear-gradient(180deg, #ede9fe 0%, #f5f3ff 45%, #eef2ff 100%);
    min-height: 100vh; color: #1e293b;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 26px 18px 100px; }

  .page-header { text-align: center; margin-bottom: 22px; position: relative; }
  .page-title { font-size: 1.85rem; font-weight: 900; color: #6d28d9; letter-spacing: 0.04em; line-height: 1.2; }
  .page-sub { font-size: 0.88rem; color: #64748b; margin-top: 6px; }
  .lock-btn {
    position: absolute; top: -4px; right: 0; padding: 7px 14px; border-radius: 12px;
    background: #fff; border: 1.5px solid #e2e8f0; color: #64748b;
    font-size: 0.82rem; font-weight: 800; font-family: inherit; cursor: pointer;
  }
  .lock-btn.open { background: #f5f3ff; border-color: #c4b5fd; color: #6d28d9; }

  .card {
    background: #fff; border-radius: 24px; padding: 22px 20px;
    box-shadow: 0 10px 38px rgba(76,29,149,0.09);
    border: 2px solid #ddd6fe; margin-bottom: 18px;
  }
  .card-title { font-size: 1.05rem; font-weight: 900; color: #6d28d9; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .hint { font-size: 0.82rem; color: #94a3b8; }

  /* 音源リスト */
  .track-list { display: flex; flex-direction: column; gap: 14px; }
  .track {
    background: #faf5ff; border: 1.5px solid #e9d5ff; border-radius: 18px; padding: 15px 17px;
  }
  .track-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .track-title { font-size: 1.05rem; font-weight: 900; color: #5b21b6; }
  .track-date { font-size: 0.78rem; color: #a78bda; font-weight: 800; flex-shrink: 0; }
  .track-note { font-size: 0.88rem; color: #475569; font-weight: 600; line-height: 1.5; white-space: pre-wrap; margin: 4px 0 10px; }
  .track audio { width: 100%; height: 42px; margin-top: 6px; }
  .skip-row { display: flex; gap: 8px; margin-top: 8px; }
  .skip-btn {
    padding: 7px 14px; border-radius: 11px; border: 1.5px solid #ddd6fe;
    background: #f5f3ff; color: #6d28d9; font-weight: 900; font-family: inherit;
    font-size: 0.86rem; cursor: pointer; line-height: 1; white-space: nowrap;
  }
  .skip-btn:hover { background: #ede9fe; }
  .skip-btn:active { transform: translateY(1px); }
  .track-foot { display: flex; align-items: center; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
  .track-dl { font-size: 0.8rem; color: #7c3aed; font-weight: 800; text-decoration: none; }
  .track-dl:hover { text-decoration: underline; }
  .track-size { font-size: 0.74rem; color: #a78bda; }
  .track-del { margin-left: auto; padding: 5px 12px; border-radius: 9px; border: none; cursor: pointer; font-size: 0.78rem; font-weight: 900; font-family: inherit; background: #fee2e2; color: #dc2626; }
  .empty { text-align: center; color: #94a3b8; font-size: 0.9rem; padding: 24px 10px; }

  /* 先生用パネル */
  #admin-card { display: none; }
  #admin-body { display: none; }
  .field-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .field-row label { font-size: 0.82rem; font-weight: 800; color: #64748b; min-width: 68px; }
  input[type="text"], input[type="date"], textarea, input[type="file"] {
    padding: 9px 12px; border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: 0.9rem; font-family: inherit; color: #1e293b;
  }
  input[type="text"], textarea { flex: 1; min-width: 180px; }
  textarea { resize: vertical; line-height: 1.5; }
  input[type="file"] { flex: 1; min-width: 200px; background: #faf5ff; }
  .btn { padding: 10px 20px; border-radius: 11px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 900; font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }
  .btn-primary:disabled { opacity: 0.45; cursor: default; }
  #up-status { font-size: 0.84rem; font-weight: 800; margin-left: 4px; }
  #up-status.ok { color: #16a34a; } #up-status.err { color: #dc2626; } #up-status.go { color: #7c3aed; }

  .back-link { display: inline-block; margin-bottom: 14px; color: #64748b; font-size: 0.85rem; font-weight: 700; text-decoration: none; }
  .back-link:hover { color: #6d28d9; }

  /* PINモーダル */
  #pin-modal { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  #pin-modal.show { display: flex; }
  .pin-box { background: #fff; border-radius: 22px; padding: 30px 26px; width: 320px; max-width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .pin-icon { font-size: 2.4rem; }
  .pin-title { font-size: 1.15rem; font-weight: 900; margin-top: 6px; }
  .pin-sub { font-size: 0.82rem; color: #94a3b8; margin: 4px 0 16px; }
  .pin-input-wrap { display: flex; gap: 6px; }
  .pin-input-wrap input { flex: 1; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 1.1rem; text-align: center; letter-spacing: 0.3em; font-family: inherit; }
  .pin-input-wrap input.error { border-color: #ef4444; animation: shake 0.4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .pin-eye { width: 46px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #f8fafc; cursor: pointer; font-size: 1.1rem; }
  .pin-err { color: #ef4444; font-size: 0.8rem; font-weight: 700; min-height: 1.1rem; margin: 8px 0; }
  .pin-btns { display: flex; gap: 8px; }
  .pin-btns button { flex: 1; padding: 11px; border-radius: 12px; border: none; cursor: pointer; font-weight: 900; font-family: inherit; }
  .pin-cancel { background: #f1f5f9; color: #64748b; }
  .pin-ok { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }

  /* 参考音源（お手本・YouTube音声のみ） */
  .ref-player { background: linear-gradient(135deg,#faf5ff,#f5f3ff); border: 1.5px solid #ddd6fe; border-radius: 18px; padding: 16px 18px; position: relative; }
  .ref-badge { display: inline-block; font-size: 0.72rem; font-weight: 900; color: #6d28d9; background: #ede9fe; border: 1px solid #c4b5fd; border-radius: 30px; padding: 2px 11px; margin-bottom: 8px; }
  .ref-title { font-size: 1.1rem; font-weight: 900; color: #5b21b6; margin-bottom: 4px; }
  .ref-note { font-size: 0.88rem; color: #475569; font-weight: 600; line-height: 1.5; white-space: pre-wrap; margin-bottom: 12px; }
  .ref-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ref-seek { min-width: 140px; }
  .ref-play { width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(135deg,#8b5cf6,#6d28d9); color: #fff; font-size: 1.25rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(109,40,217,0.35); }
  .ref-seek { flex: 1; accent-color: #7c3aed; cursor: pointer; height: 5px; }
  .ref-time { font-size: 0.8rem; color: #7c3aed; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }
  .ref-foot { margin-top: 11px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .ref-yt-link { font-size: 0.8rem; color: #7c3aed; font-weight: 800; text-decoration: none; }
  .ref-yt-link:hover { text-decoration: underline; }
  /* YouTubeプレーヤーは画面外に置き、音声のみ再生 */
  #yt-holder { position: absolute; left: -9999px; top: 0; width: 320px; height: 180px; pointer-events: none; }
  #r-status { font-size: 0.84rem; font-weight: 800; margin-left: 4px; }
  #r-status.ok { color: #16a34a; } #r-status.err { color: #dc2626; } #r-status.go { color: #7c3aed; }
  .admin-sub { font-weight: 900; color: #6d28d9; margin: 4px 0 8px; font-size: 0.92rem; }

  /* 歌詞マーカー（聴き比べ） */
  .markers-label { font-size: 0.8rem; font-weight: 900; color: #7c3aed; margin: 12px 0 5px; }
  .markers { display: flex; flex-wrap: wrap; gap: 7px; }
  .marker-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 30px; border: 1.5px solid #c4b5fd;
    background: #fff; color: #6d28d9; font-weight: 900; font-size: 0.84rem;
    font-family: inherit; cursor: pointer; line-height: 1;
  }
  .marker-chip:hover { background: #f5f3ff; }
  .marker-chip:active { transform: translateY(1px); }
  .marker-chip .mk-t { color: #a78bda; font-weight: 800; font-size: 0.76rem; font-variant-numeric: tabular-nums; }
  .marker-chip .mk-x { color: #dc2626; font-weight: 900; font-size: 0.82rem; margin-left: 1px; padding: 0 2px; }
  .marker-chip .mk-x:hover { color: #b91c1c; }
  /* 先生用：マーカー編集 */
  .mk-edit { margin-top: 11px; padding: 12px 13px; background: #fffbeb; border: 1.5px dashed #fcd34d; border-radius: 13px; }
  .mk-edit-title { font-size: 0.8rem; font-weight: 900; color: #b45309; margin-bottom: 9px; line-height: 1.4; }
  .mk-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
  .mk-preset { padding: 6px 12px; border-radius: 20px; border: 1.5px solid #e2e8f0; background: #fff; color: #64748b; font-weight: 800; font-size: 0.78rem; font-family: inherit; cursor: pointer; }
  .mk-preset.sel { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
  .mk-add-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .mk-add-row input { flex: 1; min-width: 130px; padding: 8px 11px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 0.86rem; color: #1e293b; }
  .mk-add-btn { padding: 8px 15px; border-radius: 11px; border: none; background: linear-gradient(135deg,#f59e0b,#d97706); color: #fff; font-weight: 900; font-family: inherit; font-size: 0.83rem; cursor: pointer; white-space: nowrap; }
  .mk-add-btn:active { transform: translateY(1px); }
</style>
</head>
<body>
<div class="wrap">
  <a href="class_homepage.html" class="back-link">← 学級トップへ</a>

  <div class="page-header">
    <button class="lock-btn" id="lock-btn" onclick="toggleAdmin()">🔒 先生用</button>
    <div class="page-title">🎵 合唱祭 練習音源</div>
    <div class="page-sub">練習の音源をいつでも聴けます。何度も聴いて合わせよう！</div>
  </div>

  <!-- 参考音源（お手本） -->
  <div class="card">
    <div class="card-title">📺 参考音源（お手本）</div>
    <div id="ref-view"></div>
  </div>

  <!-- 練習音源リスト -->
  <div class="card">
    <div class="card-title">🎧 練習音源</div>
    <div class="track-list" id="track-list"></div>
  </div>

  <!-- 先生用パネル -->
  <div class="card" id="admin-card">
    <div class="card-title">🔓 先生用コントロール</div>
    <div id="admin-body">
      <div class="admin-sub">📺 参考音源（お手本・YouTube／音声のみ）</div>
      <div class="field-row">
        <label>タイトル</label>
        <input type="text" id="r-title" placeholder="例: お手本の合唱「証」">
      </div>
      <div class="field-row">
        <label>YouTube</label>
        <input type="text" id="r-url" placeholder="YouTubeのURLを貼り付け">
      </div>
      <div class="field-row" style="align-items:flex-start">
        <label style="margin-top:9px">メモ</label>
        <textarea id="r-note" rows="2" placeholder="例: この合唱を参考に、強弱を意識しよう"></textarea>
      </div>
      <div class="field-row">
        <button class="btn btn-primary" onclick="setReference()">🎼 参考音源を設定</button>
        <button class="btn" style="background:#f1f5f9;color:#64748b" onclick="removeReference()">削除</button>
        <span id="r-status"></span>
      </div>
      <div class="hint">参考音源は1つ（新しく設定すると差し替え）。映像は表示せず音声だけ流します。</div>

      <hr style="border:none;border-top:1.5px dashed #e9d5ff;margin:18px 0">

      <div class="admin-sub">🎧 練習音源を追加</div>
      <div class="field-row">
        <label>タイトル</label>
        <input type="text" id="c-title" placeholder="例: 全体練習（10/2）／ソプラノ 主旋律">
      </div>
      <div class="field-row">
        <label>日付</label>
        <input type="date" id="c-date">
      </div>
      <div class="field-row" style="align-items:flex-start">
        <label style="margin-top:9px">メモ</label>
        <textarea id="c-note" rows="2" placeholder="例: Aメロの入りに注意／この音源に合わせて練習してね"></textarea>
      </div>
      <div class="field-row">
        <label>音源ファイル</label>
        <input type="file" id="c-file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac">
      </div>
      <div class="field-row">
        <button class="btn btn-primary" id="c-add-btn" onclick="addTrack()">⬆ 追加する</button>
        <span id="up-status"></span>
      </div>
      <div class="hint">MP3推奨（1分≒1MB）。追加すると自動で保存され、生徒の画面にも反映されます。</div>
    </div>
  </div>
</div>

<!-- PINモーダル -->
<div id="pin-modal">
  <div class="pin-box">
    <div class="pin-icon">🔒</div>
    <div class="pin-title">先生用ログイン</div>
    <div class="pin-sub">暗証番号を入力してください</div>
    <div class="pin-input-wrap">
      <input id="pin-input" type="password" inputmode="numeric" maxlength="20" placeholder="●●●●"
             onkeydown="if(event.key==='Enter')submitPin()">
      <button class="pin-eye" id="pin-eye" onclick="togglePinEye()" title="表示/非表示">👁</button>
    </div>
    <div class="pin-err" id="pin-err"></div>
    <div class="pin-btns">
      <button class="pin-cancel" onclick="closePinModal()">キャンセル</button>
      <button class="pin-ok" onclick="submitPin()">ログイン</button>
    </div>
  </div>
</div>

<script>
const SERVER = 'http://localhost:3456';
let _data = {};
let _adminPin = '';
let adminOpen = false;
const MARKER_LABELS = ['イントロ','Aメロ','Bメロ','サビ','2番Aメロ','2番サビ','大サビ','ラスト'];
let _mkSel = {};        // playerKey -> 選択中のプリセットラベル（先生用）
let _pushTimer = null;  // git push のまとめ送信用

function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function fmtSize(n){ if(!n) return ''; const mb=n/1048576; return mb>=1 ? mb.toFixed(1)+'MB' : Math.max(1,Math.round(n/1024))+'KB'; }
function fmtDate(s){ if(!s) return ''; const p=s.split('-'); return p.length===3 ? `${p[1]}/${p[2]}` : s; }

function ensureChorus(){ if(!_data.chorusAudio) _data.chorusAudio={tracks:[]}; if(!_data.chorusAudio.tracks) _data.chorusAudio.tracks=[]; return _data.chorusAudio; }
function getTracks(){ return ensureChorus().tracks; }

async function loadData(){
  let d=null;
  try{ const r=await fetch(SERVER+'/api/data',{signal:AbortSignal.timeout(1500)}); if(r.ok) d=await r.json(); }catch(e){}
  if(!d){ try{ const r=await fetch('data.json?_='+Date.now()); if(r.ok) d=await r.json(); }catch(e){} }
  return d||{};
}
async function saveData(){
  const pin=_adminPin||_data.adminPIN||'1210';
  try{
    await fetch(SERVER+'/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,data:_data})});
    await fetch(SERVER+'/api/git-push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
    return true;
  }catch(e){ return false; }
}
// data.json へ即時保存（git push はしない。マーカー連打用）
async function saveLocal(){
  const pin=_adminPin||_data.adminPIN||'1210';
  try{ await fetch(SERVER+'/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,data:_data})}); return true; }catch(e){ return false; }
}
// 編集が落ち着いたら1回だけ git push（家用GitHub Pagesへ反映）
function schedulePush(){
  if(_pushTimer) clearTimeout(_pushTimer);
  _pushTimer=setTimeout(async()=>{
    const pin=_adminPin||_data.adminPIN||'1210';
    try{ await fetch(SERVER+'/api/git-push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})}); }catch(e){}
  }, 3500);
}

/* ===== 描画 ===== */
function render(){
  renderReference();
  const el=document.getElementById('track-list');
  const tracks=getTracks().slice().sort((a,b)=> (a.date||'')<(b.date||'')?1:(a.date||'')>(b.date||'')?-1:0);
  if(tracks.length===0){
    el.innerHTML='<div class="empty">🎵 まだ音源がありません。<br>先生が練習の音源をアップすると、ここに出ます。</div>';
    return;
  }
  el.innerHTML=tracks.map(t=>{
    const delBtn=adminOpen?`<button class="track-del" onclick="deleteTrack('${t.id}')">🗑 削除</button>`:'';
    const note=t.note?`<div class="track-note">${escHtml(t.note)}</div>`:'';
    return `<div class="track">
      <div class="track-head">
        <span class="track-title">🎵 ${escHtml(t.title)}</span>
        <span class="track-date">${fmtDate(t.date)}</span>
      </div>
      ${note}
      <audio id="au-${escHtml(t.id)}" controls preload="none" src="${escHtml(t.file)}" onplay="onAnyPlay(this)"></audio>
      <div class="skip-row">
        <button class="skip-btn" onclick="skipAudio('au-${escHtml(t.id)}',-5)">⏪ 5秒</button>
        <button class="skip-btn" onclick="skipAudio('au-${escHtml(t.id)}',5)">5秒 ⏩</button>
      </div>
      <div id="mk-wrap-${escHtml(t.id)}">${markersHtml(t.id)}</div>
      <div class="track-foot">
        <a class="track-dl" href="${escHtml(t.file)}" download>⬇ ダウンロード</a>
        <span class="track-size">${fmtSize(t.size)}</span>
        ${delBtn}
      </div>
    </div>`;
  }).join('');
}

/* ===== 練習音源の5秒スキップ ===== */
function skipAudio(id, delta){
  const a=document.getElementById(id);
  if(!a) return;
  let t=(a.currentTime||0)+delta;
  t=Math.max(0, isFinite(a.duration) ? Math.min(a.duration, t) : t);
  try{ a.currentTime=t; }catch(e){}
}

/* ===== 歌詞マーカー（お手本と聴き比べ） ===== */
// playerKey: 'ref'=お手本(YouTube) / それ以外=track.id
function getMarkers(key){
  if(key==='ref'){ const r=getReference(); return (r&&r.markers)||[]; }
  const t=getTracks().find(x=>x.id===key); return (t&&t.markers)||[];
}
function setMarkers(key, arr){
  if(key==='ref'){ const r=getReference(); if(r) r.markers=arr; }
  else { const t=getTracks().find(x=>x.id===key); if(t) t.markers=arr; }
}
function playerCurrentTime(key){
  if(key==='ref'){ return (ytPlayer&&ytPlayer.getCurrentTime)?(ytPlayer.getCurrentTime()||0):0; }
  const a=document.getElementById('au-'+key); return a?(a.currentTime||0):0;
}
// 1つを再生するとき、他は止める（お手本↔練習のワンタップ切り替え）
function pauseOthers(key){
  document.querySelectorAll('audio').forEach(a=>{ if(a.id!=='au-'+key) a.pause(); });
  if(key!=='ref' && ytPlayer && ytPlayer.pauseVideo){
    try{ if(ytPlayer.getPlayerState && ytPlayer.getPlayerState()===YT.PlayerState.PLAYING) ytPlayer.pauseVideo(); }catch(e){}
  }
}
function onAnyPlay(el){
  document.querySelectorAll('audio').forEach(a=>{ if(a!==el) a.pause(); });
  if(ytPlayer && ytPlayer.getPlayerState){ try{ if(ytPlayer.getPlayerState()===YT.PlayerState.PLAYING) ytPlayer.pauseVideo(); }catch(e){} }
}
// マーカーの位置へジャンプして再生
function jumpTo(key, t){
  pauseOthers(key);
  if(key==='ref'){
    if(ytPlayer && ytPlayer.seekTo){ ytPlayer.seekTo(t, true); ytPlayer.playVideo(); updateRefTime(); }
  } else {
    const a=document.getElementById('au-'+key);
    if(a){ try{ a.currentTime=t; }catch(e){} a.play().catch(()=>{}); }
  }
}
// マーカー表示＋（先生用）編集UIのHTML
function markersHtml(key){
  const arr=getMarkers(key).slice().sort((a,b)=>a.t-b.t);
  let html='';
  if(arr.length){
    html+='<div class="markers-label">🔖 ここから聴く（押すと再生・お手本と聴き比べ）</div><div class="markers">';
    html+=arr.map((m,i)=>`<button class="marker-chip" onclick="jumpTo('${key}',${m.t})">`
      +`${escHtml(m.label)} <span class="mk-t">${fmtTime(m.t)}</span>`
      +(adminOpen?`<span class="mk-x" onclick="event.stopPropagation();delMarker('${key}',${i})" title="削除">✕</span>`:'')
      +`</button>`).join('');
    html+='</div>';
  }
  if(adminOpen){
    html+=`<div class="mk-edit">
      <div class="mk-edit-title">🏷 マーカーを打つ：再生して歌詞の位置まで来たら、ラベルを選んで「＋ここに印」</div>
      <div class="mk-presets">${MARKER_LABELS.map(l=>`<button class="mk-preset${_mkSel[key]===l?' sel':''}" onclick="selPreset('${key}',this.textContent)">${l}</button>`).join('')}</div>
      <div class="mk-add-row">
        <input type="text" id="mkin-${key}" placeholder="ラベル（例: サビ）" value="${escHtml(_mkSel[key]||'')}">
        <button class="mk-add-btn" onclick="addMarker('${key}')">＋ ここに印</button>
      </div>
    </div>`;
  }
  return html;
}
function selPreset(key, label){
  _mkSel[key]=label;
  const inp=document.getElementById('mkin-'+key); if(inp) inp.value=label;
  const wrap=document.getElementById('mk-wrap-'+key);
  if(wrap) wrap.querySelectorAll('.mk-preset').forEach(b=>b.classList.toggle('sel', b.textContent===label));
}
async function addMarker(key){
  const inp=document.getElementById('mkin-'+key);
  const label=((inp&&inp.value.trim())|| _mkSel[key] || '').trim();
  if(!label){ alert('ラベルを選ぶか入力してください'); return; }
  const t=Math.max(0, Math.round(playerCurrentTime(key)*10)/10);
  const arr=getMarkers(key).slice(); arr.push({label, t}); setMarkers(key, arr);
  await saveLocal(); schedulePush();
  const wrap=document.getElementById('mk-wrap-'+key); if(wrap) wrap.innerHTML=markersHtml(key);
}
async function delMarker(key, idx){
  const arr=getMarkers(key).slice().sort((a,b)=>a.t-b.t);
  if(idx<0||idx>=arr.length) return;
  arr.splice(idx,1); setMarkers(key, arr);
  await saveLocal(); schedulePush();
  const wrap=document.getElementById('mk-wrap-'+key); if(wrap) wrap.innerHTML=markersHtml(key);
}

/* ===== 参考音源（YouTube・音声のみ） ===== */
function getReference(){ return ensureChorus().reference || null; }
function extractYouTubeId(url){
  if(!url) return '';
  const s=String(url).trim();
  let m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  m=s.match(/[?&]v=([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  return '';
}
function fmtTime(s){ s=Math.max(0,Math.floor(s||0)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }

let ytApiPromise=null, ytPlayer=null, ytPollTimer=null, ytDisplayedId=null;
function loadYTApi(){
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise=new Promise(res=>{
    if(window.YT && window.YT.Player) return res();
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{ if(typeof prev==='function') prev(); res(); };
    const tag=document.createElement('script'); tag.src='https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  });
  return ytApiPromise;
}
function destroyYtPlayer(){
  if(ytPollTimer){ clearInterval(ytPollTimer); ytPollTimer=null; }
  if(ytPlayer && ytPlayer.destroy){ try{ ytPlayer.destroy(); }catch(e){} }
  ytPlayer=null;
}
function renderReference(){
  const view=document.getElementById('ref-view');
  if(!view) return;
  const ref=getReference();
  const id=ref && ref.youtubeId;
  if(!id){
    ytDisplayedId=null; destroyYtPlayer();
    view.innerHTML='<div class="empty" style="padding:18px 10px">🎼 お手本の合唱はまだ設定されていません。'+(adminOpen?'<br>下の「参考音源」から設定できます。':'')+'</div>';
    return;
  }
  // 同じ音源を表示中なら作り直さない（再生を止めない）。マーカー欄だけ更新。
  if(id===ytDisplayedId && ytPlayer){ const w=document.getElementById('mk-wrap-ref'); if(w) w.innerHTML=markersHtml('ref'); return; }
  ytDisplayedId=id;
  const note=ref.note?`<div class="ref-note">${escHtml(ref.note)}</div>`:'';
  view.innerHTML=`
    <div class="ref-player">
      <div class="ref-badge">🎼 お手本</div>
      <div class="ref-title">${escHtml(ref.title||'参考合唱')}</div>
      ${note}
      <div class="ref-controls">
        <button class="skip-btn" onclick="skipRef(-5)" title="5秒戻す">⏪ 5秒</button>
        <button class="ref-play" id="ref-play" onclick="toggleRefPlay()" title="再生 / 一時停止">▶</button>
        <button class="skip-btn" onclick="skipRef(5)" title="5秒進める">5秒 ⏩</button>
        <input type="range" class="ref-seek" id="ref-seek" min="0" max="1000" value="0" step="1"
               oninput="seekRef(this.value)">
        <span class="ref-time" id="ref-time">0:00 / 0:00</span>
      </div>
      <div class="ref-foot">
        <a class="ref-yt-link" href="https://youtu.be/${encodeURIComponent(id)}" target="_blank" rel="noopener">YouTubeで開く ↗</a>
        <span class="hint" style="font-size:.74rem">※映像は表示せず、音声だけ流れます</span>
      </div>
      <div id="mk-wrap-ref">${markersHtml('ref')}</div>
      <div id="yt-holder"><div id="yt-player"></div></div>
    </div>`;
  mountYtPlayer(id);
}
async function mountYtPlayer(id){
  await loadYTApi();
  destroyYtPlayer();
  const holder=document.getElementById('yt-player');
  if(!holder || ytDisplayedId!==id) return;
  ytPlayer=new YT.Player(holder,{
    videoId:id, width:'320', height:'180',
    playerVars:{ playsinline:1, controls:0, rel:0, modestbranding:1 },
    events:{ onReady:updateRefTime, onStateChange:onRefState }
  });
}
function onRefState(e){
  const btn=document.getElementById('ref-play');
  if(e.data===YT.PlayerState.PLAYING){ document.querySelectorAll('audio').forEach(a=>a.pause()); if(btn) btn.textContent='⏸'; if(ytPollTimer) clearInterval(ytPollTimer); ytPollTimer=setInterval(updateRefTime,400); }
  else { if(btn) btn.textContent='▶'; if(e.data!==YT.PlayerState.BUFFERING && ytPollTimer){ clearInterval(ytPollTimer); ytPollTimer=null; updateRefTime(); } }
}
function updateRefTime(){
  if(!ytPlayer || !ytPlayer.getDuration) return;
  const dur=ytPlayer.getDuration()||0, cur=ytPlayer.getCurrentTime()||0;
  const seek=document.getElementById('ref-seek'), time=document.getElementById('ref-time');
  if(seek && dur>0 && document.activeElement!==seek) seek.value=Math.round(cur/dur*1000);
  if(time) time.textContent=fmtTime(cur)+' / '+fmtTime(dur);
}
function toggleRefPlay(){
  if(!ytPlayer || !ytPlayer.getPlayerState) return;
  if(ytPlayer.getPlayerState()===YT.PlayerState.PLAYING) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
}
function seekRef(v){
  if(!ytPlayer || !ytPlayer.getDuration) return;
  const dur=ytPlayer.getDuration()||0;
  if(dur>0){ ytPlayer.seekTo(dur*(v/1000), true); updateRefTime(); }
}
function skipRef(delta){
  if(!ytPlayer || !ytPlayer.getCurrentTime) return;
  const dur=ytPlayer.getDuration()||0;
  let t=(ytPlayer.getCurrentTime()||0)+delta;
  t=Math.max(0, dur>0 ? Math.min(dur, t) : t);
  ytPlayer.seekTo(t, true);
  updateRefTime();
}
async function setReference(){
  const title=document.getElementById('r-title').value.trim();
  const url=document.getElementById('r-url').value.trim();
  const note=document.getElementById('r-note').value.trim();
  const st=document.getElementById('r-status');
  const id=extractYouTubeId(url);
  if(!id){ st.className='err'; st.textContent='⚠️ 正しいYouTube URLを入力してください'; return; }
  ensureChorus().reference={ youtubeId:id, title:title||'参考合唱', note };
  ytDisplayedId=null; // 作り直す
  st.className='go'; st.textContent='⏳ 保存・反映中...';
  const ok=await saveData();
  st.className=ok?'ok':'err'; st.textContent=ok?'✅ 設定しました！':'❌ サーバー起動を確認';
  setTimeout(()=>{ st.textContent=''; st.className=''; },3500);
  render();
}
async function removeReference(){
  if(!getReference()){ return; }
  if(!confirm('参考音源を削除しますか？')) return;
  delete ensureChorus().reference;
  ytDisplayedId=null;
  await saveData();
  render();
}

/* ===== 先生用：追加・削除 ===== */
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(new Error('ファイル読み込み失敗'));
    r.readAsDataURL(file);
  });
}
async function addTrack(){
  const title=document.getElementById('c-title').value.trim();
  const date=document.getElementById('c-date').value||todayStr();
  const note=document.getElementById('c-note').value.trim();
  const fileInput=document.getElementById('c-file');
  const file=fileInput.files&&fileInput.files[0];
  const st=document.getElementById('up-status');
  const btn=document.getElementById('c-add-btn');

  if(!title){ st.className='err'; st.textContent='⚠️ タイトルを入力してください'; return; }
  if(!file){ st.className='err'; st.textContent='⚠️ 音源ファイルを選んでください'; return; }

  btn.disabled=true; st.className='go'; st.textContent='⏳ アップロード中...';
  try{
    const dataBase64=await fileToBase64(file);
    const pin=_adminPin||_data.adminPIN||'1210';
    const r=await fetch(SERVER+'/api/upload-audio',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin,filename:file.name,dataBase64})
    });
    const res=await r.json();
    if(!res.ok) throw new Error(res.error||'アップロード失敗');

    getTracks().push({ id:'t'+Date.now()+Math.floor(Math.random()*1000), title, date, note, file:res.path, size:res.size });
    st.textContent='⏳ 保存・反映中...';
    await saveData();

    // フォームをクリア
    document.getElementById('c-title').value='';
    document.getElementById('c-note').value='';
    fileInput.value='';
    st.className='ok'; st.textContent='✅ 追加しました！';
    setTimeout(()=>{ st.textContent=''; st.className=''; },3500);
    render();
  }catch(e){
    st.className='err'; st.textContent='❌ '+(e.message||'失敗しました（サーバー起動を確認）');
  }
  btn.disabled=false;
}
async function deleteTrack(id){
  const tracks=getTracks();
  const t=tracks.find(x=>x.id===id);
  if(!t) return;
  if(!confirm(`「${t.title}」を削除しますか？`)) return;
  const pin=_adminPin||_data.adminPIN||'1210';
  try{ await fetch(SERVER+'/api/delete-audio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,path:t.file})}); }catch(e){}
  const idx=tracks.findIndex(x=>x.id===id);
  if(idx>=0) tracks.splice(idx,1);
  await saveData();
  render();
}

/* ===== PIN ===== */
function toggleAdmin(){
  if(adminOpen){
    adminOpen=false; _adminPin='';
    document.getElementById('lock-btn').textContent='🔒 先生用';
    document.getElementById('lock-btn').classList.remove('open');
    document.getElementById('admin-card').style.display='none';
    document.getElementById('admin-body').style.display='none';
    render();
  } else { openPinModal(); }
}
function openPinModal(){ const m=document.getElementById('pin-modal'); m.classList.add('show'); const i=document.getElementById('pin-input'); i.value=''; setTimeout(()=>i.focus(),50); }
function closePinModal(){ document.getElementById('pin-modal').classList.remove('show'); document.getElementById('pin-err').textContent=''; }
function togglePinEye(){ const i=document.getElementById('pin-input'),e=document.getElementById('pin-eye'); if(i.type==='password'){i.type='text';e.textContent='🙈';}else{i.type='password';e.textContent='👁';} }
function submitPin(){
  const i=document.getElementById('pin-input'),err=document.getElementById('pin-err');
  const correct=_data.adminPIN||'1210';
  if(i.value===correct){
    closePinModal();
    adminOpen=true; _adminPin=i.value;
    document.getElementById('lock-btn').textContent='🔓 先生用（管理中）';
    document.getElementById('lock-btn').classList.add('open');
    document.getElementById('admin-card').style.display='block';
    document.getElementById('admin-body').style.display='block';
    document.getElementById('c-date').value=todayStr();
    render();
  }else{
    i.classList.add('error'); err.textContent='暗証番号が違います';
    setTimeout(()=>i.classList.remove('error'),400); i.value=''; i.focus();
  }
}

document.addEventListener('DOMContentLoaded', async ()=>{
  _data=await loadData();
  render();
});
</script>
